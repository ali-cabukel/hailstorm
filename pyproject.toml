[project]
name = "hailstorm"
version = "0.1.0"
description = "Distributed hyperparameter search with Ray, Optuna, and XGBoost — demonstrated on NYC taxi tips."
authors = [
    {name = "Ali Cabukel"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "optuna>=4.0",
    "optuna-dashboard>=0.18",
    "pandas>=2.2",
    "pyarrow>=15",
    "ray[data,default,train,tune]>=2.40",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hailstorm = "hailstorm.cli:main"

[project.urls]
Repository = "https://github.com/ali-cabukel/hailstorm"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hailstorm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
